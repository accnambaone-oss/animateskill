<script src="gsap.min.js"></script>
<script>
const clamp=x=>Math.min(1,Math.max(0,x));
const smooth=x=>(x=clamp(x),x*x*(3-2*x));
const el=id=>document.getElementById(id);
function drawFrame(f){
  const lift=smooth((f-29)/90), tension=smooth((f-6)/23);
  const phase=Math.max(0,f-29), swing=32*Math.sin(phase/10)*Math.exp(-phase/38);
  const x=354+swing+154*smooth((f-86)/37), y=1036-814*lift;
  const angle=swing*.4-9*smooth((f-111)/20);
  const a=angle*Math.PI/180;
  const anchorX=x+27*Math.cos(a)-4*Math.sin(a), anchorY=y+27*Math.sin(a)+4*Math.cos(a);
  const bend=100*(1-tension);
  const d='M383 0 Q'+(385+bend)+' '+(anchorY*.69)+' '+anchorX+' '+anchorY;
  for(const id of ['rope','fiber'])el(id).setAttribute('d',d);
  el('animal').setAttribute('transform','translate('+x+' '+y+') rotate('+angle+')');
  el('tail').setAttribute('d','M-27 47 Q-86 '+(96+swing)+' -111 42 T-151 '+(30+swing*.6));
  const reach=smooth((f-96)/19),kick=Math.sin(phase/7)*Math.exp(-phase/60)*18;
  el('arm').setAttribute('d','M13 -8 Q34 '+(-4-24*reach)+' '+(32+25*reach)+' '+(-1-36*reach));
  el('foot').setAttribute('d','M-6 46q-15 20 '+(-20+kick)+' '+(26+kick*.3)+'l16 2');
}
window.drawFrame=drawFrame; drawFrame(0);
if(window.gsap){
  const clock={frame:0};
  const timeline=gsap.timeline({paused:true}).to(clock,{frame:144,duration:6,ease:'none',onUpdate:()=>drawFrame(Math.min(143,Math.round(clock.frame)))});
  window.__timelines={lift:timeline};
}
</script></html>
